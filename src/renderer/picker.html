<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DesktopPal · 寵物選擇</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#1e1e1e;color:#e6e6e6;font:15px "Microsoft JhengHei",sans-serif}h1{margin:0;font-size:25px}.pets{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px}button{font:inherit;cursor:pointer;border-radius:14px;border:1px solid #4a4a4a;background:#3d3d3d;color:#e6e6e6;padding:10px}.card img{width:100%;height:145px;object-fit:contain}.card span{display:block;font-weight:bold}.card[aria-pressed=true]{border:2px solid #4fae7c;background:#25402f}.card:hover{background:#484848}footer{display:flex;align-items:center;gap:16px;margin-top:20px}#status{font-size:15px}
.settings{display:flex;align-items:center;gap:18px;margin-top:20px;padding-top:16px;border-top:1px solid #4a4a4a;font-size:13px;flex-wrap:wrap}.settings label{display:flex;align-items:center;gap:7px}.settings select{padding:5px;border:1px solid #4a4a4a;border-radius:6px;background:#3d3d3d;color:#e6e6e6}.settings svg{width:22px;height:22px}#reveal{display:flex;align-items:center;gap:8px;margin-left:auto}
.heading{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.title-row{display:flex;align-items:center;gap:8px}.help-hint{width:26px;height:26px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}.help-hint svg{width:16px;height:16px}.language{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}.language select{padding:6px;border:1px solid #4a4a4a;border-radius:7px;background:#3d3d3d;color:#e6e6e6}
#pet-name{flex:1;padding:8px 10px;border:1px solid #4a4a4a;border-radius:8px;font:inherit;color:#e6e6e6;background:#3d3d3d}
#pet-name::placeholder{color:#9a9a9a}
input[type=checkbox]{accent-color:#4fae7c}
[data-hint]{position:relative}
[data-hint]::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:var(--tip-left,0px);width:240px;max-width:60vw;padding:10px 12px;border-radius:10px;border:1px solid #4a4a4a;background:#3d3d3d;color:#e6e6e6;font-size:13px;line-height:1.6;white-space:pre-line;box-shadow:0 4px 16px #0006;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none;z-index:20}
[data-hint]:hover::after,[data-hint]:focus-visible::after{opacity:1;visibility:visible}
.settings [data-hint]::after{top:auto;bottom:calc(100% + 8px)}
</style></head><body><div class="heading"><div class="title-row"><h1 data-label="title"></h1><button type="button" class="help-hint" data-icon="help" data-hint="hint"></button></div><label class="language"><span data-label="language"></span><select id="language-choice"><option value="system" data-label="system"></option><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option><option value="en">English</option></select></label></div><div id="pets" class="pets"></div><footer><span id="status" role="status"></span><input id="pet-name" type="text" maxlength="24" data-placeholder="namePlaceholder" /><button id="reveal" data-icon="reveal"></button></footer>
<section class="settings"><label data-hint="showPetHint"><input id="pet-visible" type="checkbox"><span data-label="showPet"></span></label><label data-hint="enabledHint"><input id="reminders-enabled" type="checkbox"><span data-label="enabled"></span></label><label data-hint="stretchHint"><span data-icon="stretch"></span><span data-label="stretch"></span><select id="stretch-minutes" aria-label="Stretch interval"><option>15</option><option>30</option><option>45</option><option>60</option><option>90</option></select><span data-label="minutes"></span></label><label data-hint="waterHint"><span data-icon="water"></span><span data-label="water"></span><select id="water-minutes" aria-label="Water interval"><option>15</option><option>30</option><option>45</option><option>60</option><option>90</option></select><span data-label="minutes"></span></label></section>
<script src="ui.js"></script><script src="picker.js"></script></body></html>
